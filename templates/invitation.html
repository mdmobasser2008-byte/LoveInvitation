<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#120014">

    <title>For {{ receiver }} ❤️</title>

    <link rel="icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E❤️%3C/text%3E%3C/svg%3E">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        /* =========================================
           PREMIUM ROMANTIC INVITATION
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255, 20, 147, 0.30),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(122, 40, 255, 0.28),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(255, 0, 128, 0.08),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #050007 0%,
                    #160015 48%,
                    #050007 100%
                );
        }


        /* =========================================
           SCENE
        ========================================= */

        .scene {
            min-height: 100vh;

            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 45px 18px;

            overflow: hidden;

            isolation: isolate;
        }


        /* =========================================
           BACKGROUND IMAGE
        ========================================= */

        .romantic-image {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 0.20;

            filter:
                blur(3px)
                saturate(1.15);

            transform: scale(1.08);

            pointer-events: none;

            z-index: -3;

            animation:
                backgroundZoom 14s ease-in-out infinite alternate;
        }


        @keyframes backgroundZoom {

            from {
                transform: scale(1.06);
            }

            to {
                transform: scale(1.14);
            }

        }


        /* =========================================
           DARK OVERLAY
        ========================================= */

        .scene::before {
            content: "";

            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(3, 0, 8, 0.90),
                    rgba(25, 0, 28, 0.70),
                    rgba(4, 0, 10, 0.92)
                );

            z-index: -2;

            pointer-events: none;
        }


        /* =========================================
           AMBIENT LIGHT
        ========================================= */

        .scene::after {
            content: "";

            position: fixed;

            width: 520px;
            height: 520px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 20, 147, 0.16),
                    transparent 70%
                );

            top: -230px;
            right: -180px;

            filter: blur(20px);

            animation:
                ambientMove 8s ease-in-out infinite alternate;

            pointer-events: none;

            z-index: -1;
        }


        @keyframes ambientMove {

            from {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate(-80px, 90px)
                    scale(1.2);
            }

        }


        /* =========================================
           LOVE CARD
        ========================================= */

        .love-card {

            width: 100%;

            max-width: 650px;

            position: relative;

            z-index: 20;

            padding: 48px 34px;

            text-align: center;

            border-radius: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.15),
                    rgba(255,255,255,0.045)
                );

            border:
                1px solid
                rgba(255,255,255,0.20);

            backdrop-filter:
                blur(30px)
                saturate(140%);

            -webkit-backdrop-filter:
                blur(30px)
                saturate(140%);

            box-shadow:
                0 35px 100px
                rgba(0,0,0,0.65),

                0 0 80px
                rgba(255,20,147,0.08),

                inset 0 1px 0
                rgba(255,255,255,0.20),

                inset 0 0 40px
                rgba(255,255,255,0.025);

            transform:
                perspective(1200px)
                translateY(0);

            animation:
                cardEnter 1s cubic-bezier(.2,.8,.2,1);

            overflow: hidden;
        }


        /* Card shine */

        .love-card::before {

            content: "";

            position: absolute;

            width: 240px;
            height: 240px;

            top: -130px;
            left: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.13),
                    transparent 70%
                );

            filter: blur(5px);

            pointer-events: none;

            animation:
                cardLight 6s ease-in-out infinite alternate;
        }


        @keyframes cardLight {

            from {
                transform:
                    translate(0, 0);
            }

            to {
                transform:
                    translate(500px, 300px);
            }

        }


        @keyframes cardEnter {

            from {
                opacity: 0;

                transform:
                    perspective(1200px)
                    translateY(70px)
                    rotateX(8deg)
                    scale(0.90);
            }

            to {
                opacity: 1;

                transform:
                    perspective(1200px)
                    translateY(0)
                    rotateX(0)
                    scale(1);
            }

        }


        /* =========================================
           TOP HEART
        ========================================= */

        .small-heart {

            width: 92px;
            height: 92px;

            margin:
                0 auto 25px;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            border-radius: 50%;

            font-size: 46px;

            background:
                linear-gradient(
                    145deg,
                    #ff1493,
                    #ff4fb3 55%,
                    #ff79c6
                );

            border:
                1px solid
                rgba(255,255,255,0.30);

            box-shadow:

                0 18px 45px
                rgba(255,20,147,0.45),

                0 0 55px
                rgba(255,20,147,0.18),

                inset 0 5px 14px
                rgba(255,255,255,0.30);

            animation:
                heartBeat 1.7s ease-in-out infinite;
        }


        .small-heart::after {

            content: "";

            position: absolute;

            inset: 7px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.20);

            pointer-events: none;
        }


        @keyframes heartBeat {

            0%,
            100% {
                transform:
                    scale(1);
            }

            45% {
                transform:
                    scale(1.06);
            }

            55% {
                transform:
                    scale(1.12);
            }

            65% {
                transform:
                    scale(1.04);
            }

        }


        /* =========================================
           TITLE
        ========================================= */

        .love-card h1 {

            margin:
                0 0 22px;

            font-size: 38px;

            line-height: 1.2;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffc3e5,
                    #ffffff,
                    #ffb0da,
                    #ffffff
                );

            background-size: 250% auto;

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            animation:
                titleShine 4s linear infinite;

            filter:
                drop-shadow(
                    0 0 14px
                    rgba(255,20,147,0.25)
                );
        }


        @keyframes titleShine {

            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 250% center;
            }

        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {

            margin:
                0 auto 22px;

            max-width: 530px;

            padding: 22px 21px;

            border-radius: 22px;

            color: #ffe8f5;

            font-size: 17px;

            line-height: 1.85;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.075),
                    rgba(255,255,255,0.025)
                );

            border:
                1px solid
                rgba(255,255,255,0.10);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.10),

                0 12px 35px
                rgba(0,0,0,0.16);

            animation:
                messageAppear 1.2s ease 0.2s both;
        }


        @keyframes messageAppear {

            from {
                opacity: 0;

                transform:
                    translateY(18px)
                    scale(0.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================
           FROM
        ========================================= */

        .from {

            margin:
                0 0 34px;

            color: #ffb9dc;

            font-size: 15px;

            font-style: italic;

            opacity: 0.95;

            animation:
                fromAppear 1.4s ease 0.4s both;
        }


        @keyframes fromAppear {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 0.95;
                transform: translateY(0);
            }

        }


        /* =========================================
           QUESTION
        ========================================= */

        #questionArea {

            animation:
                questionAppear 1s ease 0.6s both;
        }


        @keyframes questionAppear {

            from {
                opacity: 0;

                transform:
                    translateY(22px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        #questionArea h2 {

            margin:
                0 0 28px;

            font-size: 28px;

            color: #ffffff;

            text-shadow:
                0 0 20px
                rgba(255,20,147,0.35);
        }


        /* =========================================
           BUTTON AREA
        ========================================= */

        .buttons {

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 16px;

            min-height: 68px;

            position: relative;
        }


        /* =========================================
           ALL BUTTONS
        ========================================= */

        .buttons button {

            border: none;

            min-width: 145px;

            padding: 16px 27px;

            border-radius: 18px;

            font-size: 17px;

            font-weight: 800;

            letter-spacing: 0.3px;

            color: white;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                opacity 0.25s ease;

            -webkit-tap-highlight-color: transparent;

            user-select: none;
        }


        .buttons button::before {

            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.30),
                    transparent
                );

            transform: skewX(-20deg);

            transition:
                left 0.6s ease;
        }


        .buttons button:hover::before {

            left: 150%;
        }


        /* =========================================
           YES BUTTON
        ========================================= */

        #yesBtn {

            background:
                linear-gradient(
                    135deg,
                    #00a844,
                    #00c853 45%,
                    #69f0ae
                );

            box-shadow:
                0 12px 32px
                rgba(0,200,83,0.38),

                inset 0 1px 0
                rgba(255,255,255,0.35);

            animation:
                yesPulse 2s ease-in-out infinite;
        }


        #yesBtn:hover {

            transform:
                translateY(-5px)
                scale(1.045);

            box-shadow:
                0 18px 45px
                rgba(0,200,83,0.62),

                0 0 25px
                rgba(105,240,174,0.25),

                inset 0 1px 0
                rgba(255,255,255,0.40);
        }


        #yesBtn:active {

            transform:
                translateY(-1px)
                scale(0.98);
        }


        #yesBtn:disabled {

            cursor: wait;

            opacity: 0.85;

            animation: none;
        }


        @keyframes yesPulse {

            0%,
            100% {

                box-shadow:
                    0 12px 32px
                    rgba(0,200,83,0.32),

                    inset 0 1px 0
                    rgba(255,255,255,0.30);
            }

            50% {

                box-shadow:
                    0 14px 42px
                    rgba(0,200,83,0.58),

                    0 0 24px
                    rgba(105,240,174,0.20),

                    inset 0 1px 0
                    rgba(255,255,255,0.35);
            }

        }


        /* =========================================
           NO BUTTON
        ========================================= */

        #noBtn {

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.10),
                    rgba(255,255,255,0.045)
                );

            border:
                1px solid
                rgba(255,255,255,0.18);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                0 10px 28px
                rgba(0,0,0,0.25),

                inset 0 1px 0
                rgba(255,255,255,0.15);
        }


        #noBtn:hover {

            transform:
                translateY(-4px)
                scale(1.02);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.35);
        }


        /* =========================================
           FUNNY MESSAGE
        ========================================= */

        #funnyMessage {

            min-height: 28px;

            margin:
                18px 0 0;

            color: #ffb3db;

            font-size: 14px;

            font-weight: bold;

            text-shadow:
                0 0 12px
                rgba(255,20,147,0.25);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        /* =========================================
           SUCCESS AREA
        ========================================= */

        #successArea {

            display: none;

            animation:
                successAppear 0.9s
                cubic-bezier(.2,.8,.2,1);
        }


        @keyframes successAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.70)
                    translateY(25px)
                    rotateX(10deg);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0)
                    rotateX(0);
            }

        }


        .success-heart {

            font-size: 82px;

            line-height: 1;

            margin-bottom: 15px;

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(255,20,147,0.55)
                );

            animation:
                successHeart 1.2s
                ease-in-out infinite;
        }


        @keyframes successHeart {

            0%,
            100% {
                transform:
                    scale(1)
                    rotate(0deg);
            }

            50% {
                transform:
                    scale(1.20)
                    rotate(-4deg);
            }

        }


        #successArea h2 {

            margin:
                0 0 15px;

            font-size: 42px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ff83c5,
                    #ffffff
                );

            background-size: 200% auto;

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            animation:
                successTitle 3s linear infinite;
        }


        @keyframes successTitle {

            from {
                background-position: 0% center;
            }

            to {
                background-position: 200% center;
            }

        }


        #successArea p {

            margin: 0;

            color: #ffe5f2;

            font-size: 16px;

            line-height: 1.8;
        }


        .success-hearts {

            margin-top: 24px;

            font-size: 27px;

            letter-spacing: 6px;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(255,20,147,0.35)
                );

            animation:
                floatingSuccess 2s
                ease-in-out infinite;
        }


        @keyframes floatingSuccess {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-9px);
            }

        }


        /* =========================================
           FLOATING HEART RAIN
        ========================================= */

        .heart-rain {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 5;
        }


        .heart-rain span {

            position: absolute;

            bottom: -60px;

            font-size: 22px;

            opacity: 0;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255,20,147,0.35)
                );

            animation:
                rainHeart linear infinite;
        }


        .heart-rain span:nth-child(1) {
            left: 4%;
            animation-duration: 8s;
            animation-delay: 0s;
        }

        .heart-rain span:nth-child(2) {
            left: 13%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .heart-rain span:nth-child(3) {
            left: 23%;
            animation-duration: 7s;
            animation-delay: 1s;
        }

        .heart-rain span:nth-child(4) {
            left: 34%;
            animation-duration: 11s;
            animation-delay: 4s;
        }

        .heart-rain span:nth-child(5) {
            left: 46%;
            animation-duration: 8s;
            animation-delay: 3s;
        }

        .heart-rain span:nth-child(6) {
            left: 58%;
            animation-duration: 10s;
            animation-delay: 1s;
        }

        .heart-rain span:nth-child(7) {
            left: 69%;
            animation-duration: 7s;
            animation-delay: 4s;
        }

        .heart-rain span:nth-child(8) {
            left: 79%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .heart-rain span:nth-child(9) {
            left: 90%;
            animation-duration: 11s;
            animation-delay: 5s;
        }

        .heart-rain span:nth-child(10) {
            left: 53%;
            animation-duration: 8s;
            animation-delay: 6s;
        }


        @keyframes rainHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(0.55);

                opacity: 0;
            }

            10% {
                opacity: 0.72;
            }

            50% {
                transform:
                    translateY(-55vh)
                    translateX(25px)
                    rotate(180deg)
                    scale(1);
            }

            90% {
                opacity: 0.40;
            }

            100% {

                transform:
                    translateY(-120vh)
                    translateX(-20px)
                    rotate(360deg)
                    scale(1.35);

                opacity: 0;
            }

        }


        /* =========================================
           CELEBRATION HEARTS
        ========================================= */

        .celebration-heart {

            position: fixed;

            bottom: -70px;

            pointer-events: none;

            z-index: 999999;

            user-select: none;

            animation:
                celebrationFloat 5s
                linear forwards;
        }


        @keyframes celebrationFloat {

            0% {

                transform:
                    translateY(0)
                    scale(0.4)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            45% {

                transform:
                    translateY(-50vh)
                    scale(1.05)
                    rotate(180deg);
            }

            100% {

                transform:
                    translateY(-120vh)
                    scale(1.5)
                    rotate(360deg);

                opacity: 0;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .scene {

                min-height: 100svh;

                padding:
                    25px 12px;
            }


            .love-card {

                padding:
                    35px 18px;

                border-radius:
                    27px;
            }


            .small-heart {

                width: 76px;
                height: 76px;

                font-size: 38px;

                margin-bottom: 20px;
            }


            .love-card h1 {

                font-size: 29px;

                margin-bottom: 18px;
            }


            .message {

                font-size: 15px;

                line-height: 1.75;

                padding: 17px 15px;
            }


            .from {

                font-size: 14px;

                margin-bottom: 28px;
            }


            #questionArea h2 {

                font-size: 23px;

                line-height: 1.4;

                margin-bottom: 22px;
            }


            .buttons {

                gap: 10px;
            }


            .buttons button {

                min-width: 120px;

                padding:
                    14px 17px;

                font-size: 15px;

                border-radius: 16px;
            }


            #funnyMessage {

                font-size: 13px;
            }


            .success-heart {

                font-size: 68px;
            }


            #successArea h2 {

                font-size: 34px;
            }


            #successArea p {

                font-size: 15px;
            }


            .success-hearts {

                font-size: 23px;

                letter-spacing: 3px;
            }

        }


        /* =========================================
           VERY SMALL SCREEN
        ========================================= */

        @media (max-width: 380px) {

            .scene {

                padding:
                    18px 10px;
            }


            .love-card {

                padding:
                    28px 15px;
            }


            .buttons {

                flex-direction: column;

                min-height: 125px;
            }


            .buttons button {

                width: 100%;

                max-width: 220px;
            }

        }


        /* =========================================
           REDUCE MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                scroll-behavior:
                    auto !important;
            }

        }

    </style>

</head>


<body class="romantic-body">


    <!-- =========================================
         ROMANTIC SCENE
    ========================================== -->

    <div class="scene">


        <!-- Background Image -->

        <img
            src="{{ url_for('static', filename='images/romantic-couple.png') }}"
            class="romantic-image"
            alt="Romantic Couple"
        >


        <!-- =====================================
             FLOATING HEARTS
        ====================================== -->

        <div class="heart-rain">

            <span>❤️</span>
            <span>💕</span>
            <span>💗</span>
            <span>💖</span>
            <span>💓</span>
            <span>💘</span>
            <span>💞</span>
            <span>❤️</span>
            <span>💗</span>
            <span>💕</span>

        </div>


        <!-- =====================================
             LOVE CARD
        ====================================== -->

        <div class="love-card">


            <!-- Top Heart -->

            <div class="small-heart">
                ❤️
            </div>


            <!-- Receiver -->

            <h1>
                Dear {{ receiver }} 💕
            </h1>


            <!-- Personal Message -->

            <p class="message">
                {{ message }}
            </p>


            <!-- Sender -->

            <p class="from">
                — With love, {{ sender }} ❤️
            </p>


            <!-- =================================
                 QUESTION
            ================================== -->

            <div id="questionArea">


                <h2>
                    Will you be mine? 💍❤️
                </h2>


                <div class="buttons">


                    <!-- YES BUTTON -->

                    <button
                        id="yesBtn"
                        type="button">

                        YES ❤️

                    </button>


                    <!-- NO BUTTON -->

                    <button
                        id="noBtn"
                        type="button">

                        NO 😜

                    </button>


                </div>


                <p id="funnyMessage"></p>


            </div>


            <!-- =================================
                 SUCCESS
            ================================== -->

            <div id="successArea">


                <div class="success-heart">
                    💖
                </div>


                <h2>
                    Yaaay! ❤️
                </h2>


                <p>
                    You just made someone's
                    heart extremely happy! 🥰
                </p>


                <div class="success-hearts">
                    ❤️ 💕 💖 💗 💓
                </div>


            </div>


        </div>

    </div>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const noBtn =
            document.getElementById("noBtn");

        const yesBtn =
            document.getElementById("yesBtn");

        const funnyMessage =
            document.getElementById("funnyMessage");


        /* =========================================
           FUNNY MESSAGES
        ========================================= */

        const funnyTexts = [

            "Are you sure? 🥺",

            "Think again! 😏",

            "Nice try 😂",

            "NO button doesn't work! 😜",

            "You can't escape love ❤️",

            "Come on... press YES 💕",

            "The NO button is shy 🙈",

            "Wrong button! 😂",

            "Love says YES ❤️",

            "Almost caught it! 😈",

            "Try again... if you can 😜",

            "Your heart already knows the answer ❤️"

        ];


        let messageIndex = 0;


        /* =========================================
           MOVE NO BUTTON
        ========================================= */

        function moveNoButton() {


            /*
                NO button-কে body-এর direct child করছি
                যাতে fixed position ঠিকভাবে কাজ করে
            */

            if (
                noBtn.parentElement !==
                document.body
            ) {

                document.body.appendChild(
                    noBtn
                );

            }


            /* Button size */

            const rect =
                noBtn.getBoundingClientRect();


            const buttonWidth =
                rect.width;

            const buttonHeight =
                rect.height;


            /*
                Screen-এর edge থেকে safe distance
            */

            const padding = 18;


            const maxX =
                Math.max(
                    padding,
                    window.innerWidth -
                    buttonWidth -
                    padding
                );


            const maxY =
                Math.max(
                    padding,
                    window.innerHeight -
                    buttonHeight -
                    padding
                );


            /*
                Random X
            */

            const randomX =
                padding +
                Math.random() *
                Math.max(
                    1,
                    maxX - padding
                );


            /*
                Random Y
            */

            const randomY =
                padding +
                Math.random() *
                Math.max(
                    1,
                    maxY - padding
                );


            /*
                Fixed position
            */

            noBtn.style.position =
                "fixed";

            noBtn.style.left =
                randomX + "px";

            noBtn.style.top =
                randomY + "px";

            noBtn.style.zIndex =
                "999999";


            /*
                Funny message animation
            */

            funnyMessage.style.opacity =
                "0";

            funnyMessage.style.transform =
                "translateY(6px)";


            setTimeout(function () {

                funnyMessage.textContent =
                    funnyTexts[messageIndex];

                funnyMessage.style.opacity =
                    "1";

                funnyMessage.style.transform =
                    "translateY(0)";

            }, 120);


            messageIndex++;


            if (
                messageIndex >=
                funnyTexts.length
            ) {

                messageIndex = 0;

            }

        }


        /* =========================================
           DESKTOP
        ========================================= */

        noBtn.addEventListener(
            "mouseenter",
            moveNoButton
        );


        /* =========================================
           MOBILE
        ========================================= */

        noBtn.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                moveNoButton();

            },
            {
                passive: false
            }
        );


        /* =========================================
           NO CLICK
        ========================================= */

        noBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                moveNoButton();

            }
        );


        /* =========================================
           YES BUTTON
        ========================================= */

        yesBtn.addEventListener(
            "click",
            sayYes
        );


        async function sayYes() {


            /* Double click বন্ধ */

            yesBtn.disabled = true;


            /* Loading */

            yesBtn.innerHTML =
                "Saving ❤️";


            try {


                /*
                    Flask backend-এ YES পাঠাচ্ছি
                */

                const response =
                    await fetch(
                        "/invitation/{{ invitation_id }}/yes",
                        {
                            method: "POST"
                        }
                    );


                /*
                    JSON response
                */

                const data =
                    await response.json();


                /* সফল হলে */

                if (data.success) {


                    const questionArea =
                        document.getElementById(
                            "questionArea"
                        );


                    const successArea =
                        document.getElementById(
                            "successArea"
                        );


                    /*
                        Question hide
                    */

                    questionArea.style.display =
                        "none";


                    /*
                        Success show
                    */

                    successArea.style.display =
                        "block";


                    /*
                        Celebration শুরু
                    */

                    createCelebration();


                }

                else {


                    yesBtn.disabled =
                        false;

                    yesBtn.innerHTML =
                        "YES ❤️";

                }


            }

            catch (error) {


                console.error(
                    "YES response error:",
                    error
                );


                yesBtn.disabled =
                    false;


                yesBtn.innerHTML =
                    "YES ❤️";


                funnyMessage.textContent =
                    "Something went wrong 😢 Please try again.";

            }

        }


        /* =========================================
           CELEBRATION
        ========================================= */

        function createCelebration() {


            const hearts = [

                "❤️",
                "💕",
                "💖",
                "💗",
                "💓",
                "💘",
                "💞",
                "💝",
                "🥰"

            ];


            /*
                70টি celebration heart
            */

            for (
                let i = 0;
                i < 70;
                i++
            ) {


                setTimeout(
                    function () {


                        const heart =
                            document.createElement(
                                "div"
                            );


                        heart.className =
                            "celebration-heart";


                        /*
                            Random heart
                        */

                        heart.textContent =
                            hearts[
                                Math.floor(
                                    Math.random() *
                                    hearts.length
                                )
                            ];


                        /*
                            Random horizontal position
                        */

                        heart.style.left =
                            Math.random() *
                            100 +
                            "vw";


                        /*
                            Random size
                        */

                        heart.style.fontSize =
                            (
                                18 +
                                Math.random() *
                                32
                            ) +
                            "px";


                        /*
                            Random speed
                        */

                        heart.style.animationDuration =
                            (
                                4 +
                                Math.random() *
                                3
                            ) +
                            "s";


                        /*
                            Screen-এ যোগ করছি
                        */

                        document.body.appendChild(
                            heart
                        );


                        /*
                            Animation শেষ হলে remove
                        */

                        setTimeout(
                            function () {

                                heart.remove();

                            },
                            7500
                        );


                    },
                    i * 45
                );

            }

        }


        /* =========================================
           RESIZE
        ========================================= */

        window.addEventListener(
            "resize",
            function () {


                /*
                    NO button যদি fixed থাকে
                */

                if (
                    noBtn.style.position ===
                    "fixed"
                ) {


                    const rect =
                        noBtn.getBoundingClientRect();


                    const padding = 18;


                    const maxX =
                        Math.max(
                            padding,
                            window.innerWidth -
                            rect.width -
                            padding
                        );


                    const maxY =
                        Math.max(
                            padding,
                            window.innerHeight -
                            rect.height -
                            padding
                        );


                    let x =
                        Math.min(
                            rect.left,
                            maxX
                        );


                    let y =
                        Math.min(
                            rect.top,
                            maxY
                        );


                    x =
                        Math.max(
                            padding,
                            x
                        );


                    y =
                        Math.max(
                            padding,
                            y
                        );


                    noBtn.style.left =
                        x + "px";


                    noBtn.style.top =
                        y + "px";

                }

            }
        );


    </script>

</body>

</html>
